# nginx serves the built React app AND reverse-proxies the API, so the browser
# sees ONE origin (no CORS needed — exactly what api.ts assumes).

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Allow large uploads (receipts/scans/PDFs). Without this nginx caps bodies
    # at 1 MB and big files would 413 before ever reaching FastAPI.
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. We point nginx at it explicitly so that the
    # "app" hostname is re-resolved at request time (with a short TTL) instead
    # of being cached once at startup. Without this, recreating the app
    # container (new IP) makes nginx keep proxying to the dead old IP → 502
    # until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    # API calls go to the FastAPI container. "app" is the compose service name,
    # resolved over the internal network; 8001 is its port. Using a variable for
    # the upstream forces nginx to use the `resolver` above (dynamic DNS) rather
    # than resolving once at config-load time.
    location /api/ {
        set $upstream_app app;
        proxy_pass http://$upstream_app:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # File downloads can be large; don't buffer the whole response in nginx.
        proxy_buffering off;
        # Vision + embedding can be slow on the sync path; be generous.
        proxy_read_timeout 300s;
    }

    # Keep password guessing and accidental login loops inexpensive. This is
    # deliberately simple and sufficient for a single-instance personal app.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        set $upstream_app app;
        proxy_pass http://$upstream_app:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: react-router owns client-side routes like /chat, /documents.
    # On a hard refresh of those URLs there's no matching file, so serve
    # index.html and let React render the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
