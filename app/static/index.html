<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家用文件知识库</title>
  <!-- React + Babel via CDN: no node build step needed for this teaching app. -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
           background: #f5f5f7; color: #1a1a1a; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 8px 18px; border-radius: 999px; border: 1px solid #ddd; background: #fff;
           cursor: pointer; font-size: 14px; }
    .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 18px;
            margin-bottom: 12px; }
    .drop { border: 2px dashed #ccc; border-radius: 12px; padding: 40px; text-align: center;
            color: #888; cursor: pointer; background: #fff; }
    .drop.over { border-color: #1a1a1a; color: #1a1a1a; }
    button { background: #1a1a1a; color: #fff; border: none; border-radius: 8px;
             padding: 10px 16px; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: .5; cursor: default; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px;
                       font-size: 14px; }
    .row { display: flex; gap: 8px; }
    .tag { display: inline-block; background: #eef; color: #336; border-radius: 6px;
           padding: 2px 8px; font-size: 12px; margin-right: 6px; }
    .muted { color: #999; font-size: 12px; }
    .bubble { padding: 12px 14px; border-radius: 12px; margin-bottom: 10px; max-width: 85%;
              white-space: pre-wrap; line-height: 1.5; }
    .bubble.user { background: #1a1a1a; color: #fff; margin-left: auto; }
    .bubble.bot { background: #fff; border: 1px solid #e5e5e5; }
    .health { font-size: 12px; margin-bottom: 16px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .model-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; }
    .model-bar select { padding: 5px 10px; border: 1px solid #ddd; border-radius: 8px;
                        font-size: 13px; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function Health() {
      const [h, setH] = useState(null);
      useEffect(() => {
        fetch("/api/health").then(r => r.json()).then(setH).catch(() => {});
      }, []);
      if (!h) return null;
      const dot = ok => <span className="dot" style={{background: ok ? "#2c2" : "#c33"}}></span>;
      return <div className="health">{dot(h.postgres)}PostgreSQL&nbsp;&nbsp;{dot(h.chroma)}ChromaDB</div>;
    }

    function Upload({ model }) {
      const [over, setOver] = useState(false);
      const [busy, setBusy] = useState(false);
      const [result, setResult] = useState(null);
      const [err, setErr] = useState(null);
      const inputRef = useRef();

      async function send(file) {
        setBusy(true); setErr(null); setResult(null);
        const fd = new FormData();
        fd.append("file", file);
        if (model) fd.append("model", model);
        try {
          const r = await fetch("/api/upload", { method: "POST", body: fd });
          if (!r.ok) throw new Error((await r.json()).detail || "上传失败");
          setResult(await r.json());
        } catch (e) { setErr(e.message); }
        setBusy(false);
      }

      return (
        <div>
          <div className={"drop" + (over ? " over" : "")}
               onClick={() => inputRef.current.click()}
               onDragOver={e => { e.preventDefault(); setOver(true); }}
               onDragLeave={() => setOver(false)}
               onDrop={e => { e.preventDefault(); setOver(false);
                              if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]); }}>
            {busy ? "正在理解文件…" : "点击或拖拽文件到这里上传（PDF / JPG / PNG）"}
          </div>
          <input ref={inputRef} type="file" style={{display: "none"}}
                 onChange={e => e.target.files[0] && send(e.target.files[0])} />
          {err && <div className="card" style={{color: "#c33"}}>{err}</div>}
          {result && (
            <div className="card">
              <div><b>已入库</b> <span className="muted">{result.file_id}</span></div>
              <p style={{margin: "8px 0"}}>{result.doc.summary}</p>
              <div>类型：<span className="tag">{result.doc.doc_type}</span>
                   {result.doc.vendor && <span>商家：{result.doc.vendor}　</span>}
                   {result.doc.amount && <span>金额：{result.doc.amount} {result.doc.currency}</span>}</div>
              <div className="muted" style={{marginTop: 10}}>embedding 文本：{result.embedding_text}</div>
            </div>
          )}
        </div>
      );
    }

    function Files() {
      const [docs, setDocs] = useState([]);
      useEffect(() => {
        fetch("/api/documents").then(r => r.json()).then(setDocs).catch(() => {});
      }, []);
      if (!docs.length) return <div className="card muted">还没有文件，先去上传页添加。</div>;
      return docs.map(d => (
        <div className="card" key={d.file_id}>
          <div><span className="tag">{d.doc_type}</span>
               <b>{d.vendor || "（无商家）"}</b>
               {d.amount && <span> · {d.amount} {d.currency}</span>}</div>
          <p style={{margin: "8px 0 4px"}}>{d.summary}</p>
          <div className="muted">{d.doc_date || ""} · {d.file_id.slice(0, 8)}</div>
        </div>
      ));
    }

    function Chat({ model }) {
      const [msgs, setMsgs] = useState([]);
      const [q, setQ] = useState("");
      const [busy, setBusy] = useState(false);

      async function ask() {
        const question = q.trim();
        if (!question || busy) return;
        setMsgs(m => [...m, {role: "user", text: question}]);
        setQ(""); setBusy(true);
        try {
          const r = await fetch("/api/ask", {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({question, model: model || undefined}),
          });
          const data = await r.json();
          setMsgs(m => [...m, {role: "bot", text: data.answer || data.detail || "出错了"}]);
        } catch (e) {
          setMsgs(m => [...m, {role: "bot", text: "请求失败：" + e.message}]);
        }
        setBusy(false);
      }

      return (
        <div>
          <div style={{marginBottom: 16}}>
            {msgs.map((m, i) => <div key={i} className={"bubble " + m.role}>{m.text}</div>)}
            {busy && <div className="bubble bot muted">思考中…</div>}
          </div>
          <div className="row">
            <input type="text" value={q} placeholder="用自然语言问你的文件…"
                   onChange={e => setQ(e.target.value)}
                   onKeyDown={e => e.key === "Enter" && ask()} />
            <button onClick={ask} disabled={busy}>发送</button>
          </div>
        </div>
      );
    }

    function ModelSelector({ models, selected, onChange }) {
      if (!models) return null;
      return (
        <div className="model-bar">
          <span style={{color: "#888"}}>模型：</span>
          <select value={selected} onChange={e => onChange(e.target.value)}>
            {Object.entries(models).map(([id, label]) =>
              <option key={id} value={id}>{label}</option>)}
          </select>
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState("upload");
      const [models, setModels] = useState(null);
      const [model, setModel] = useState("");
      const tabs = {upload: "上传", files: "文件", chat: "问答"};

      useEffect(() => {
        fetch("/api/models").then(r => r.json()).then(data => {
          setModels(data);
          setModel(Object.keys(data)[0]);
        }).catch(() => {});
      }, []);

      return (
        <div className="wrap">
          <h1>家用文件知识库</h1>
          <div className="sub">拍照或拖拽上传文件，用自然语言搜索与问答</div>
          <Health />
          <ModelSelector models={models} selected={model} onChange={setModel} />
          <div className="tabs">
            {Object.keys(tabs).map(k =>
              <div key={k} className={"tab" + (tab === k ? " active" : "")}
                   onClick={() => setTab(k)}>{tabs[k]}</div>)}
          </div>
          {tab === "upload" && <Upload model={model} />}
          {tab === "files" && <Files />}
          {tab === "chat" && <Chat model={model} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
