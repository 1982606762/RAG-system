services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ragdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Preserve the existing volume name. No schema migration runs at startup.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    restart: unless-stopped
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      # Use libpq variables so passwords do not need DSN-string escaping.
      PG_DSN: ""
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ragdb
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DOCUMENTS_DIR: /documents
    volumes:
      # Original uploads remain available for the future migration, read-only.
      - ./files:/files:ro
      - ./files/mvp:/documents
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8001:80"
    depends_on:
      - app

volumes:
  pgdata:
