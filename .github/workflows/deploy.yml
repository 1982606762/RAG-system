name: Deploy verified MVP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rag-production-deployment
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/test.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Transfer and deploy the tested release
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          trap 'rm -f ~/.ssh/id_deploy' EXIT
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/id_deploy -p "$SSH_PORT")
          release="$DEPLOY_PATH/.releases/$GITHUB_SHA"
          printf -v command 'umask 077; mkdir -p %q; tar -xz -C %q' "$release" "$release"
          git archive --format=tar.gz HEAD | ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "$command"
          printf -v command 'bash %q %q %q' "$release/scripts/deploy-server.sh" "$DEPLOY_PATH" "$GITHUB_SHA"
          ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "$command"
