# Push-to-deploy: every push to `main` SSHes into the VPS, pulls the
# latest code, and rebuilds the Docker stack.
#
# Uses the runner's native OpenSSH client so the behavior matches exactly
# what works from your laptop: ssh -i key -o IdentitiesOnly=yes user@host
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST       server IP or domain
#   SSH_USER       login user (e.g. deploy)
#   SSH_PORT       SSH port (usually 22)
#   SSH_KEY        the PRIVATE key whose public half is in the user's authorized_keys
#   DEPLOY_PATH    absolute path of the repo on the server (e.g. /home/deploy/RAG-system)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          mkdir -p ~/.ssh
          # Write the private key; printf guarantees a trailing newline.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Trust the host key so ssh doesn't prompt.
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # IdentitiesOnly=yes -> use ONLY this key, exactly like the local test.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "set -e && cd $DEPLOY_PATH && git pull --ff-only origin main && docker compose up -d --build && docker image prune -f"
