# Push-to-deploy: every push to `main` SSHes into the VPS, pulls the
# latest code, and rebuilds the Docker stack.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST       server IP or domain
#   SSH_USER       login user (e.g. ubuntu / root / deploy)
#   SSH_PORT       SSH port (usually 22)
#   SSH_KEY        the PRIVATE key whose public half is in the server's authorized_keys
#   DEPLOY_PATH    absolute path of the repo on the server (e.g. /home/ubuntu/rag)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only origin main
            # Rebuild only the app image and restart; postgres/chroma keep their data.
            docker compose up -d --build
            # Drop dangling images so the disk doesn't fill up over time.
            docker image prune -f
